<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    width: 1200px; 
    height: 630px; 
    background: #1a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    position: relative;
  }
  /* Subtle warm gradient behind logo */
  body::before {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(201,149,108,0.08) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .logo {
    height: 120px;
    width: auto;
    object-fit: contain;
  }
  .tagline {
    color: #e0d6cc;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.02em;
  }
  .cta {
    margin-top: 16px;
    padding: 14px 36px;
    border: 1.5px solid #c9956c;
    border-radius: 999px;
    color: #c9956c;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.03em;
    background: rgba(201,149,108,0.08);
  }
</style>
</head>
<body>
  <img src="/logo.png" class="logo" alt="BookFlix">
  <div class="tagline">Rent Your Next Great Read</div>
  <div class="cta">Browse the Catalog →</div>
</body>
</html>
